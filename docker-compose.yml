services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-zapper}
      POSTGRES_USER: ${POSTGRES_USER:-zapper}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-zapper-dev-only}
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-zapper} -d ${POSTGRES_DB:-zapper}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes: ["postgres-data:/var/lib/postgresql/data"]
  acme-stub:
    build: { context: ., dockerfile: src/Acme.Pay.Stub/Dockerfile }
    environment:
      ASPNETCORE_URLS: http://+:8080
      Acme__ApiKey: ${ACME_API_KEY:-local-api-key}
      Acme__CallbackSecret: ${ACME_CALLBACK_SECRET:-local-callback-secret}
      Acme__CallbackBaseUrl: http://payments-api:8080
    ports: ["8081:8080"]
  payments-api:
    build: { context: ., dockerfile: src/Zapper.Payments.Api/Dockerfile }
    environment:
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Payments: Host=postgres;Port=5432;Database=${POSTGRES_DB:-zapper};Username=${POSTGRES_USER:-zapper};Password=${POSTGRES_PASSWORD:-zapper-dev-only}
      Acme__BaseUrl: http://acme-stub:8080
      Acme__ApiKey: ${ACME_API_KEY:-local-api-key}
      Acme__CallbackSecret: ${ACME_CALLBACK_SECRET:-local-callback-secret}
      Acme__RequestTimeoutSeconds: 3
      Acme__MaxConcurrency: 20
    ports: ["8080:8080"]
    depends_on:
      postgres: { condition: service_healthy }
      acme-stub: { condition: service_started }
volumes: { postgres-data: {} }
